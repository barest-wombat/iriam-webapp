<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#7a4ce3">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="IRIAMランク">
    <title>IRIAMランク管理</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="header-row">
            <h1>IRIAMランク管理ツール</h1>
            <div class="header-right">
            <div class="theme-controls" id="themeControls">
                <button class="theme-btn active" data-value="auto"  title="デバイスに合わせる">◑</button>
                <button class="theme-btn"        data-value="light" title="ライトモード">☀</button>
                <button class="theme-btn"        data-value="dark"  title="ダークモード">☾</button>
            </div>
            <button id="clearStorageBtn" class="clear-btn" title="保存データをリセット">
                <svg viewBox="0 0 16 18" fill="none" xmlns="http://www.w3.org/2000/svg" width="15" height="17"><path d="M1 4h14M6 4V2h4v2M3 4l1 12h8l1-12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            </div>
        </div>

        <section class="input-section">
            <h2>現在の状態</h2>
            <div class="form-row">
                <label for="startDate">開始日:</label>
                <input type="date" id="startDate">
            </div>
            <div class="form-row">
                <label>現在ランク:</label>
                <div class="slider-container">
                    <input type="range" id="currentRankSlider" min="0" max="14" step="1" value="7">
                    <span class="slider-value" id="currentRankValue">B2</span>
                </div>
            </div>
            <div class="form-row">
                <label>現在ランクスコア:</label>
                <div class="slider-container">
                    <input type="range" id="currentScoreSlider" min="0" max="18" step="1" value="0">
                    <span class="slider-value" id="currentScoreValue">0</span>
                </div>
            </div>
            <div class="form-row">
                <label>残り日数:</label>
                <div class="slider-container">
                    <input type="range" id="daysLeftSlider" min="1" max="7" step="1" value="7">
                    <span class="slider-value" id="daysLeftValue">7</span>
                </div>
            </div>
            <div class="form-row">
                <label>スキップパス枚数:</label>
                <div class="slider-container">
                    <input type="range" id="skipPassesSlider" min="0" max="10" step="1" value="0">
                    <span class="slider-value" id="skipPassesValue">0</span>
                </div>
            </div>
        </section>

        <section class="plan-section">
            <h2>予定入力</h2>
            <div class="table-scroll">
                <table id="planTable">
                    <thead>
                        <tr>
                            <th>日</th>
                            <th>予定(+)</th>
                            <th>スキップ</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </section>

        <button id="calculateButton">計算</button>

        <section class="result-section">
            <h2>計算結果</h2>
            <div class="table-scroll">
                <table id="resultTable">
                    <thead>
                        <tr>
                            <th>日</th>
                            <th>ランク</th>
                            <th>ランクスコア</th>
                            <th>残りスキップパス</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </section>

        <section class="card-section">
            <h2>最終日予測カード</h2>
            <div class="rank-card" id="rankCard">
                <div class="rank-header" id="rankLabel">--</div>
                <div class="score-info" id="scoreDisplay">-- / 18</div>
                <div class="days-info" id="daysInfo">残り--日でランクダウン</div>
                <div class="keep-up-container">
                    <div class="keep">
                        ランクキープ<br><span id="keepNeeded">あと+--</span>
                    </div>
                    <div class="up">
                        ランクアップ<br><span id="upNeeded">あと+--</span>
                    </div>
                </div>
                <div class="daily-score">
                    デイリーランクスコア<br><span id="dailyScore">+--</span>
                    <div id="dailyTimeLeft" class="daily-time-left" style="display:none"></div>
                </div>
            </div>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
