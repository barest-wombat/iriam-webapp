<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IRIAMランク管理Webアプリ</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="header-row">
            <h1>IRIAMランク管理ツール</h1>
            <div class="theme-controls" id="themeControls">
                <button class="theme-btn active" data-value="auto">デバイス</button>
                <button class="theme-btn" data-value="light">ライト</button>
                <button class="theme-btn" data-value="dark">ダーク</button>
            </div>
        </div>

        <section class="input-section">
            <h2>現在の状態</h2>
            <div class="form-row">
                <label for="currentRank">現在ランク:</label>
                <select id="currentRank"></select>
            </div>
            <div class="form-row">
                <label for="currentScore">現在ランクスコア:</label>
                <input type="number" id="currentScore" min="0" max="18" value="0">
            </div>
            <div class="form-row">
                <label for="startDate">開始日:</label>
                <input type="date" id="startDate">
            </div>
            <div class="form-row">
                <label for="daysLeft">残り日数:</label>
                <input type="number" id="daysLeft" min="1" max="7" value="7">
            </div>
            <div class="form-row">
                <label for="skipPasses">スキップパス枚数:</label>
                <input type="number" id="skipPasses" min="0" max="10" value="0">
            </div>
        </section>

        <section class="plan-section">
            <h2>7日間の予定入力</h2>
            <table id="planTable">
                <thead>
                    <tr>
                        <th>日</th>
                        <th>予定(+)</th>
                        <th>スキップパス使用</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </section>

        <button id="calculateButton">計算</button>

        <section class="result-section">
            <h2>計算結果</h2>
            <table id="resultTable">
                <thead>
                    <tr>
                        <th>日</th>
                        <th>翌日ランクスコア</th>
                        <th>翌日ランク</th>
                        <th>残りスキップパス</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </section>

        <section class="card-section">
            <h2>最終日予測カード</h2>
            <div class="rank-card" id="rankCard">
                <div class="rank-header" id="rankLabel">--</div>
                <div class="score-info" id="scoreDisplay">-- / 18</div>
                <div class="days-info" id="daysInfo">残り--日でランクダウン</div>
                <div class="keep-up-container">
                    <div class="keep">
                        ランクキープ<br><span id="keepNeeded">あと+--</span>
                    </div>
                    <div class="up">
                        ランクアップ<br><span id="upNeeded">あと+--</span>
                    </div>
                </div>
                <div class="daily-score">
                    デイリーランクスコア<br><span id="dailyScore">+--</span>
                </div>
                <div class="support-points">
                    応援ポイント<br><span id="supportPoints">--</span>
                </div>
            </div>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
